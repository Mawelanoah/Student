<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Student Marketplace</title>
  <meta name="theme-color" content="#5420A8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem}
    @media(min-width:700px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
    .stat-card{background:#fff;border:1px solid var(--color-border);border-radius:12px;padding:1rem}
    .stat-card strong{display:block;font-size:1.35rem;color:var(--color-primary)}
    .stat-card span{font-size:0.7rem;color:var(--color-text-muted)}
    .app-card{border:1px solid var(--color-border);border-radius:12px;padding:1rem;margin-bottom:0.75rem;background:#fff}
    .app-card h3{font-size:1rem;margin-bottom:0.35rem}
    .app-meta{font-size:0.8rem;color:var(--color-text-secondary);margin-bottom:0.5rem;white-space:pre-wrap}
    .app-actions{display:flex;flex-wrap:wrap;gap:0.5rem;margin-top:0.75rem}
    .empty-box{background:var(--color-surface);border:1px dashed var(--color-border);border-radius:12px;padding:1.25rem;font-size:0.9rem;color:var(--color-text-secondary);line-height:1.5}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="dashboard.html" class="logo"><span class="logo-icon">SM</span><span>Admin</span></a>
      <button type="button" class="btn btn-outline btn-sm" id="logout-btn">Logout</button>
    </div>
  </header>
  <main class="section">
    <div class="container">
      <h1 class="section-title">Admin overview</h1>
      <p id="admin-name" class="section-subtitle">Loading…</p>
      <div class="stat-grid" id="stats">
        <div class="stat-card"><strong id="s-users">—</strong><span>Users</span></div>
        <div class="stat-card"><strong id="s-sellers">—</strong><span>Sellers</span></div>
        <div class="stat-card"><strong id="s-pending">—</strong><span>Pending sellers</span></div>
        <div class="stat-card"><strong id="s-products">—</strong><span>Products</span></div>
      </div>

      <h2 class="section-title" style="margin-top:2rem;font-size:1.25rem;">Pending seller applications</h2>
      <p style="font-size:0.85rem;color:var(--color-text-muted);margin-bottom:1rem;">
        Approve/Reject buttons appear only when a student has submitted an application.
      </p>
      <div id="apps-list"><p style="color:var(--color-text-muted)">Loading…</p></div>

      <h2 class="section-title" style="margin-top:2rem;font-size:1.25rem;">All applications</h2>
      <div id="all-apps"><p style="color:var(--color-text-muted)">Loading…</p></div>

      <p style="margin-top:1.5rem">
        <a href="../seller/apply.html" class="btn btn-primary btn-sm" target="_blank">Open apply form</a>
        <a href="../index.html" class="btn btn-ghost btn-sm">View shop</a>
      </p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/session.js"></script>
  <script>
    document.getElementById("logout-btn").addEventListener("click", function () {
      window.smLogout("login.html");
    });

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    (async function () {
      var session = await window.smRequireRole(["admin"], "login.html");
      if (!session) return;
      document.getElementById("admin-name").textContent =
        "Signed in as " + (session.profile.full_name || session.profile.email || "Admin");

      var client = window.smGetClient();

      async function loadStats() {
        try {
          var users = await client.from("profiles").select("id", { count: "exact", head: true });
          var sellers = await client.from("profiles").select("id", { count: "exact", head: true }).eq("role", "seller");
          var pending = await client.from("seller_applications").select("id", { count: "exact", head: true }).eq("status", "pending");
          var products = await client.from("products").select("id", { count: "exact", head: true });
          document.getElementById("s-users").textContent = users.count != null ? users.count : "—";
          document.getElementById("s-sellers").textContent = sellers.count != null ? sellers.count : "—";
          document.getElementById("s-pending").textContent = pending.count != null ? pending.count : "—";
          document.getElementById("s-products").textContent = products.count != null ? products.count : "—";
        } catch (e) {
          console.warn("Stats", e);
        }
      }

      async function reviewApp(id, newStatus, appRow) {
        var r = await client.rpc("admin_review_seller_application", {
          application_id: id,
          new_status: newStatus
        });
        if (r.error) {
          // Fallback direct updates (needs RLS policies)
          var u1 = await client.from("seller_applications").update({
            status: newStatus,
            reviewed_at: new Date().toISOString()
          }).eq("id", id);
          if (u1.error) throw u1.error;
          if (newStatus === "approved" && appRow && appRow.user_id) {
            var u2 = await client.from("profiles").update({
              role: "seller",
              is_verified: true
            }).eq("id", appRow.user_id);
            if (u2.error) throw u2.error;
          }
        }
      }

      function renderPending(rows) {
        var list = document.getElementById("apps-list");
        if (!rows.length) {
          list.innerHTML =
            '<div class="empty-box">' +
            "<strong>No pending applications yet.</strong><br><br>" +
            "Approve buttons only appear after a <em>student</em> account submits the form.<br><br>" +
            "1. Open a private/incognito window<br>" +
            "2. Register a second student account (not admin)<br>" +
            "3. Go to <a href='../seller/apply.html'>seller/apply.html</a> and submit<br>" +
            "4. Refresh this dashboard — Approve / Reject will show here" +
            "</div>";
          return;
        }
        list.innerHTML = rows.map(function (app) {
          return (
            '<div class="app-card" data-id="' + app.id + '">' +
              "<h3>" + escapeHtml(app.full_name || "Applicant") + "</h3>" +
              '<div class="app-meta">' +
              escapeHtml(app.email || "") + " · WhatsApp: " + escapeHtml(app.whatsapp || "—") +
              "\nCampus: " + escapeHtml(app.campus || "—") +
              " · Student #: " + escapeHtml(app.student_number || "—") +
              (app.notes ? "\n" + escapeHtml(app.notes) : "") +
              "</div>" +
              '<div class="app-actions">' +
              '<button type="button" class="btn btn-primary btn-sm" data-action="approve">Approve as seller</button>' +
              '<button type="button" class="btn btn-outline btn-sm" data-action="reject">Reject</button>' +
              "</div></div>"
          );
        }).join("");

        list.querySelectorAll("[data-action]").forEach(function (btn) {
          btn.addEventListener("click", async function () {
            var card = btn.closest(".app-card");
            var id = card.getAttribute("data-id");
            var action = btn.getAttribute("data-action");
            var appRow = rows.find(function (a) { return a.id === id; });
            btn.disabled = true;
            try {
              await reviewApp(id, action === "approve" ? "approved" : "rejected", appRow);
              card.remove();
              await loadStats();
              await loadAll();
            } catch (err) {
              alert((err && err.message) || "Update failed. Run seller-applications-fix.sql in Supabase.");
              btn.disabled = false;
            }
          });
        });
      }

      async function loadPending() {
        var res = await client
          .from("seller_applications")
          .select("*")
          .eq("status", "pending")
          .order("created_at", { ascending: false })
          .limit(50);
        if (res.error) {
          document.getElementById("apps-list").innerHTML =
            "<p style='color:#DC2626'>Error loading applications: " + escapeHtml(res.error.message) +
            ". Run supabase/seller-applications-fix.sql in the SQL Editor.</p>";
          return;
        }
        renderPending(res.data || []);
      }

      async function loadAll() {
        var box = document.getElementById("all-apps");
        var res = await client
          .from("seller_applications")
          .select("*")
          .order("created_at", { ascending: false })
          .limit(100);
        if (res.error) {
          box.innerHTML = "<p style='color:#DC2626'>" + escapeHtml(res.error.message) + "</p>";
          return;
        }
        if (!res.data || !res.data.length) {
          box.innerHTML = '<div class="empty-box">Table is empty — no one has applied yet.</div>';
          return;
        }
        box.innerHTML = res.data.map(function (a) {
          return (
            '<div class="app-card">' +
              "<strong>" + escapeHtml(a.full_name || "") + "</strong> · " +
              "<span style='text-transform:uppercase;font-size:0.75rem'>" + escapeHtml(a.status) + "</span>" +
              "<div class='app-meta'>" + escapeHtml(a.email || "") + " · " + escapeHtml(a.whatsapp || "") + "</div>" +
            "</div>"
          );
        }).join("");
      }

      await loadStats();
      await loadPending();
      await loadAll();
    })();
  </script>
</body>
</html>
