<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">SM</span><span>Student Marketplace</span></a>
      <nav class="nav-desktop"><a href="index.html">Home</a><a href="marketplace.html">Browse</a><a href="safety.html">Safety</a></nav>

        <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>

    <div class="demo-notice"><span>ℹ️</span><div><strong>Demo only</strong> — No account is created. Real registration comes in Phase 2.</div></div>
    <form onsubmit="return false;">
      <div class="form-group"><label class="form-label">Full name</label><input type="text" class="form-input" placeholder="Your name"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" placeholder="you@example.com"></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" placeholder="Create a password"></div>
      <button type="button" class="btn btn-primary btn-lg btn-block" onclick="alert('Demo only. Real registration in Phase 2.')">Create account (demo)</button>
    </form>
    <p class="text-center mt-4" style="font-size:0.875rem;color:var(--color-text-secondary);">Already have an account? <a href="login.html">Log in</a></p>
