<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Login | Student Marketplace</title>
  <meta name="theme-color" content="#5420A8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/brand.css">
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a href="../index.html" class="logo"><span class="logo-icon">SM</span><span>Seller Portal</span></a>
    <a href="../index.html" class="btn btn-ghost btn-sm">Back to shop</a>
  </div></header>
  <main class="section"><div class="container" style="max-width:420px;">
    <h1 class="section-title text-center">Seller login</h1>
    <div class="demo-notice"><span>ℹ️</span><div>Connect Supabase (SETUP.md) for real auth.</div></div>
    <form onsubmit="event.preventDefault();alert('Configure Supabase in js/supabase-client.js');">
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" required></div>
      <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" required></div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
    </form>
    <p class="text-center mt-4" style="font-size:0.875rem;">No account? <a href="register.html">Apply as seller</a></p>
  </div></main>
</body>
</html>
