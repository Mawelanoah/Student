<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Student Marketplace</title>
  <meta name="theme-color" content="#5420A8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/brand.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo"><span class="logo-icon">SM</span><span>Student Marketplace</span></a>
      <nav class="nav-desktop"><a href="index.html">Home</a><a href="marketplace.html">Marketplace</a><a href="services.html">Services</a></nav>
      <div class="header-actions">
        <a href="register.html" class="btn btn-primary btn-sm">Create account</a>
        <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="24" height="24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
    <nav class="nav-mobile" id="mobile-nav">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Marketplace</a>
      <a href="register.html" class="btn btn-primary">Create account</a>
    </nav>
  </header>
  <main class="section">
    <div class="container" style="max-width:420px;">
      <h1 class="section-title text-center">Log in</h1>
      <p class="section-subtitle text-center">Access your Student Marketplace account</p>
      <div id="auth-message" style="display:none;"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" name="email" class="form-input" required autocomplete="email" placeholder="you@gmail.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
      </form>
      <p class="text-center mt-4" style="font-size:0.875rem;color:var(--color-text-secondary);">
        Don’t have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", function (e) {
      e.preventDefault();
      window.smLogin(this);
    });
  </script>
</body>
</html>
